<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Land 3D - World 1-1</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1a1a; 
            font-family: 'Courier New', Courier, monospace; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #ui-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .controls-container {
            height: 250px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: none; 
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            pointer-events: none;
        }

        @media (hover: none) and (pointer: coarse), (max-width: 800px) {
            .controls-container { display: flex; }
        }

        .d-pad { position: relative; width: 140px; height: 140px; pointer-events: auto; }
        .d-btn { 
            position: absolute; 
            background: rgba(255, 255, 255, 0.15); 
            border: 2px solid rgba(255, 255, 255, 0.3); 
            border-radius: 8px; 
            backdrop-filter: blur(4px); 
        }
        .d-btn:active, .d-btn.active { background: rgba(255, 255, 255, 0.4); }
        .d-up { top: 0; left: 46px; width: 46px; height: 46px; }
        .d-down { bottom: 0; left: 46px; width: 46px; height: 46px; }
        .d-left { top: 46px; left: 0; width: 46px; height: 46px; }
        .d-right { top: 46px; right: 0; width: 46px; height: 46px; }
        .d-center { top: 46px; left: 46px; width: 46px; height: 46px; border: none; }

        .action-pad { position: relative; width: 140px; height: 140px; pointer-events: auto; }
        .a-btn { 
            position: absolute; bottom: 20px; right: 10px; width: 80px; height: 80px; 
            background: rgba(255, 0, 100, 0.4); border: 3px solid rgba(255, 0, 100, 0.6); 
            border-radius: 50%; backdrop-filter: blur(4px); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .a-btn:active, .a-btn.active { background: rgba(255, 0, 100, 0.7); transform: scale(0.95); }

        #game-ui {
            position: absolute;
            top: 25%; /* Roughly where screen is */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; /* Virtual UI space */
            text-align: right;
            color: #0f380f;
            font-weight: bold;
            font-size: 20px;
            opacity: 0; /* Hidden, we draw into 3D now */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="controls-container">
            <div class="d-pad">
                <div class="d-btn d-up" data-key="up"></div>
                <div class="d-btn d-left" data-key="left"></div>
                <div class="d-btn d-center"></div>
                <div class="d-btn d-right" data-key="right"></div>
                <div class="d-btn d-down" data-key="down"></div>
            </div>
            <div class="action-pad">
                <div class="a-btn" data-key="jump"></div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>

    <script>
        // --- 1. GAME ASSETS & DATA ---
        
        const PALETTE = {
            gb1: '#ffffff', gb2: '#8bac0f', gb3: '#306230', gb4: '#0f380f',
            body: '#e6e6e6', bezel: '#777777', btn_a: '#d50065', btn_start: '#555555'
        };

        const P_MAP = { 1: PALETTE.gb1, 2: PALETTE.gb2, 3: PALETTE.gb3, 4: PALETTE.gb4 };

        function createTexture(pixels, w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,w,h);
            for(let i=0; i<pixels.length; i++) {
                if(pixels[i] === 0) continue; 
                const x = i % w; const y = Math.floor(i / w);
                ctx.fillStyle = P_MAP[pixels[i]];
                ctx.fillRect(x,y,1,1);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        // Mario (Super Mario Land Style - Smaller, rounder)
        const MARIO_DATA = [
            0,0,0,0,4,4,4,4,4,0,0,0,
            0,0,0,4,2,2,2,4,4,4,0,0,
            0,0,0,4,2,2,2,2,2,4,4,4,
            0,0,0,4,2,2,2,2,2,4,4,4,
            0,0,0,0,4,4,4,4,4,4,4,0,
            0,0,0,4,4,4,4,4,2,2,4,0,
            0,0,4,2,2,4,4,4,4,2,4,0,
            0,0,4,2,2,4,4,4,2,2,4,0,
            0,4,4,4,4,4,4,4,4,4,4,0,
            0,4,4,4,4,4,4,4,4,4,4,0,
            0,2,2,4,2,2,4,2,2,4,2,2,
            0,2,2,4,4,4,4,4,4,4,2,2,
            0,0,0,4,4,4,0,0,4,4,4,0,
            0,0,4,4,4,4,0,0,4,4,4,4,
            0,0,4,4,4,4,0,0,4,4,4,4
        ]; // 12x15 roughly, we map to 16x16
        // Pad to 16x16
        const MARIO_16 = new Array(256).fill(0);
        for(let y=0; y<15; y++) {
            for(let x=0; x<12; x++) {
                MARIO_16[(y+1)*16 + (x+2)] = MARIO_DATA[y*12+x];
            }
        }

        // Goomba (Chibi-style from SML)
        const GOOMBA_DATA = [
            0,0,0,0,4,4,4,4,0,0,0,0,
            0,0,0,4,3,3,3,3,4,0,0,0,
            0,0,4,3,3,3,3,3,3,4,0,0,
            0,0,4,3,1,3,3,1,3,4,0,0,
            0,0,4,3,3,3,3,3,3,4,0,0,
            0,0,4,3,3,3,3,3,3,4,0,0,
            0,0,0,4,4,4,4,4,4,0,0,0,
            0,0,0,4,4,0,0,4,4,0,0,0,
            0,0,4,4,4,0,0,4,4,4,0,0
        ]; // 12x9
        const GOOMBA_16 = new Array(256).fill(0);
        for(let y=0; y<9; y++) for(let x=0; x<12; x++) GOOMBA_16[(y+7)*16 + (x+2)] = GOOMBA_DATA[y*12+x];

        // Brick (SML has small bricks)
        const BRICK_16 = new Array(256).fill(0).map((_,i)=>{
            const x=i%16, y=Math.floor(i/16);
            if(x===0||y===0) return 4; // Dark Border
            if(x===15||y===15) return 4;
            if(x===8 || y===8) return 3; // Inner detail
            return 2; // Fill
        });

        // Question Block
        const Q_16 = new Array(256).fill(0).map((_,i)=>{
            const x=i%16, y=Math.floor(i/16);
            if(x===0||y===0||x===15||y===15) return 4;
            if(x>4&&x<12&&y>4&&y<12) return 4; // Dot
            return 2; 
        });

        // Hard Block (Ground)
        const HARD_16 = new Array(256).fill(0).map((_,i)=>{
            const x=i%16, y=Math.floor(i/16);
            if((x+y)%4===0) return 4;
            return 2;
        });

        const texMario = createTexture(MARIO_16, 16, 16);
        const texGoomba = createTexture(GOOMBA_16, 16, 16);
        const texBrick = createTexture(BRICK_16, 16, 16);
        const texQ = createTexture(Q_16, 16, 16);
        const texHard = createTexture(HARD_16, 16, 16);

        // --- 2. THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.enableDamping = true;
        controls.minDistance = 10;
        controls.maxDistance = 25;
        controls.maxPolarAngle = Math.PI / 1.3;

        const ambi = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambi);
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(5, 10, 8);
        sun.castShadow = true;
        scene.add(sun);

        // --- 3. GAMEBOY MODEL ---
        const gbGroup = new THREE.Group();
        scene.add(gbGroup);

        const matBody = new THREE.MeshStandardMaterial({ color: PALETTE.body, roughness: 0.4 });
        const matBezel = new THREE.MeshStandardMaterial({ color: PALETTE.bezel, roughness: 0.5 });
        const matBtnA = new THREE.MeshStandardMaterial({ color: PALETTE.btn_a });
        const matBtnStart = new THREE.MeshStandardMaterial({ color: PALETTE.btn_start });
        const matDpad = new THREE.MeshStandardMaterial({ color: '#222' });

        const shell = new THREE.Mesh(new THREE.RoundedBoxGeometry(9, 15, 2, 4, 0.5), matBody);
        shell.castShadow = true; shell.receiveShadow = true;
        gbGroup.add(shell);

        const bezel = new THREE.Mesh(new THREE.RoundedBoxGeometry(8, 6.5, 0.2, 4, 0.2), matBezel);
        bezel.position.set(0, 2.5, 1.05);
        gbGroup.add(bezel);

        // Screen Diorama
        const screenW=6, screenH=5, screenD=4;
        const screenBg = new THREE.Mesh(new THREE.PlaneGeometry(screenW, screenH), new THREE.MeshBasicMaterial({color:'#c4d7a0'}));
        screenBg.position.set(0, 2.5, 1.05 - screenD);
        gbGroup.add(screenBg);

        // Walls
        const wallMat = new THREE.MeshBasicMaterial({color:'#aab880'});
        const lw = new THREE.Mesh(new THREE.PlaneGeometry(screenD, screenH), wallMat);
        lw.rotation.y=Math.PI/2; lw.position.set(-screenW/2, 2.5, 1.05-screenD/2);
        gbGroup.add(lw);
        const rw = lw.clone(); rw.rotation.y=-Math.PI/2; rw.position.x=screenW/2;
        gbGroup.add(rw);
        const bw = new THREE.Mesh(new THREE.PlaneGeometry(screenW, screenD), wallMat);
        bw.rotation.x=-Math.PI/2; bw.position.set(0, 2.5-screenH/2, 1.05-screenD/2);
        gbGroup.add(bw);

        // UI Text in 3D (Score)
        const canvasUI = document.createElement('canvas');
        canvasUI.width = 256; canvasUI.height = 64;
        const ctxUI = canvasUI.getContext('2d');
        const texUI = new THREE.CanvasTexture(canvasUI);
        const uiPlane = new THREE.Mesh(new THREE.PlaneGeometry(4, 1), new THREE.MeshBasicMaterial({map: texUI, transparent:true}));
        uiPlane.position.set(0, 4.2, 1.05 - 1); // Top of screen
        gbGroup.add(uiPlane);

        let score = 0;
        let coins = 0;
        function updateUI() {
            ctxUI.clearRect(0,0,256,64);
            ctxUI.font = 'bold 40px Courier New';
            ctxUI.fillStyle = '#0f380f';
            ctxUI.textAlign = 'left';
            ctxUI.fillText(`MARIO  x${coins}`, 10, 50);
            ctxUI.textAlign = 'right';
            ctxUI.fillText(`${score}`, 240, 50);
            texUI.needsUpdate = true;
        }
        updateUI();


        // --- 4. GAME WORLD ---
        const worldGroup = new THREE.Group();
        worldGroup.position.set(0, 2.5, 1.05 - screenD/2);
        gbGroup.add(worldGroup);

        // Background
        const bgGroup = new THREE.Group();
        worldGroup.add(bgGroup);
        // Pyramids (SML distinctive feature)
        const pyrGeo = new THREE.ConeGeometry(1.5, 2, 4);
        const pyrMat = new THREE.MeshBasicMaterial({color: PALETTE.gb3});
        for(let i=0; i<5; i++) {
            const p = new THREE.Mesh(pyrGeo, pyrMat);
            p.rotation.y = Math.PI/4;
            p.position.set(-5 + i*8, -1.5, -1);
            bgGroup.add(p);
        }

        const gameLayer = new THREE.Group();
        worldGroup.add(gameLayer);

        // Level Generation
        const BLK = 0.6;
        const matBrick = new THREE.MeshStandardMaterial({map:texBrick});
        const matQ = new THREE.MeshStandardMaterial({map:texQ});
        const matHard = new THREE.MeshStandardMaterial({map:texHard});
        const matPipe = new THREE.MeshStandardMaterial({color:PALETTE.gb3});

        const blocks = []; // Colliders
        const entities = []; // Dynamic objects (Goombas)
        const particles = []; // Debris

        function createBlock(x, y, type) {
            let mat = matHard;
            if(type==='brick') mat = matBrick;
            if(type==='q') mat = matQ;
            
            const b = new THREE.Mesh(new THREE.BoxGeometry(BLK, BLK, BLK), mat);
            b.position.set(x*BLK, y*BLK - 2, 0);
            b.castShadow = true; b.receiveShadow = true;
            gameLayer.add(b);
            
            blocks.push({
                x: x*BLK, y: y*BLK - 2, w: BLK, h: BLK,
                type: type, mesh: b, active: true
            });
        }

        function createPipe(x, height) {
            const p = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, height*BLK, 16), matPipe);
            p.position.set(x*BLK, (height*BLK)/2 - 2.3, 0.5); // Foreground
            gameLayer.add(p);
            // Collision for pipe is just a block
            blocks.push({
                x: x*BLK, y: (height*BLK)/2 - 2.3, w: 0.8, h: height*BLK,
                type: 'solid', mesh: p
            });
        }

        // --- WORLD 1-1 LAYOUT ---
        // Ground
        for(let i=-2; i<60; i++) {
            if(i===25 || i===26) continue; // Gap
            createBlock(i, 0, 'hard');
            createBlock(i, -1, 'hard');
        }

        // Structures
        createBlock(6, 3, 'q');
        createBlock(10, 3, 'brick');
        createBlock(11, 3, 'q');
        createBlock(12, 3, 'brick');
        createBlock(11, 6, 'q');
        
        createPipe(16, 2);
        createPipe(22, 3);
        createPipe(29, 4); // The tall one
        
        createPipe(40, 2); // Hidden area entrance style

        // Enemies (Goombas)
        const goombas = [];
        const matGoomba = new THREE.MeshBasicMaterial({map:texGoomba, transparent:true, side:THREE.DoubleSide});
        
        function spawnGoomba(x, y) {
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), matGoomba);
            mesh.position.set(x*BLK, y*BLK - 1.5, 0.2);
            gameLayer.add(mesh);
            goombas.push({
                x: x*BLK, y: y*BLK - 1.5,
                vx: -1.5, vy: 0,
                mesh: mesh,
                dead: false
            });
        }

        spawnGoomba(14, 2);
        spawnGoomba(26, 2);
        spawnGoomba(33, 2);
        spawnGoomba(35, 2);

        // --- PLAYER ---
        const matMario = new THREE.MeshBasicMaterial({map:texMario, transparent:true, side:THREE.DoubleSide});
        const marioMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), matMario);
        marioMesh.position.z = 0.3;
        gameLayer.add(marioMesh);

        const player = {
            x: 0, y: -1, vx: 0, vy: 0,
            grounded: false, facingRight: true, dead: false
        };

        // --- CONTROLS ---
        const keys = { l:false, r:false, u:false };
        window.onkeydown = e => {
            if(e.code==='ArrowLeft') keys.l=true;
            if(e.code==='ArrowRight') keys.r=true;
            if(e.code==='Space'||e.code==='ArrowUp'||e.key==='z') keys.u=true;
        };
        window.onkeyup = e => {
            if(e.code==='ArrowLeft') keys.l=false;
            if(e.code==='ArrowRight') keys.r=false;
            if(e.code==='Space'||e.code==='ArrowUp'||e.key==='z') keys.u=false;
        };

        // Touch
        document.querySelectorAll('.d-btn').forEach(b => {
            b.ontouchstart = e => { e.preventDefault(); if(b.dataset.key==='left') keys.l=true; if(b.dataset.key==='right') keys.r=true; if(b.dataset.key==='up') keys.u=true; b.classList.add('active'); };
            b.ontouchend = e => { e.preventDefault(); if(b.dataset.key==='left') keys.l=false; if(b.dataset.key==='right') keys.r=false; if(b.dataset.key==='up') keys.u=false; b.classList.remove('active'); };
        });
        const btnA = document.querySelector('.a-btn');
        btnA.ontouchstart = e => { e.preventDefault(); keys.u=true; btnA.classList.add('active'); };
        btnA.ontouchend = e => { e.preventDefault(); keys.u=false; btnA.classList.remove('active'); };

        // --- PHYSICS ENGINE ---
        const GRAVITY = 25;
        const SPEED = 5;
        const JUMP = 10;
        const FRICTION = 0.8;

        function checkRect(r1, r2) {
            return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                    r1.y < r2.y + r2.h && r1.y + r1.h > r2.y);
        }

        function update(dt) {
            if(player.dead) {
                player.vy -= GRAVITY * dt;
                player.y += player.vy * dt;
                marioMesh.position.y = player.y;
                return;
            }

            // Input
            if(keys.l) { player.vx -= SPEED*dt*2; player.facingRight=false; }
            if(keys.r) { player.vx += SPEED*dt*2; player.facingRight=true; }
            player.vx *= FRICTION;

            // X Movement
            player.x += player.vx * dt;
            // X Collision
            const pRectX = {x:player.x-0.3, y:player.y-0.3, w:0.6, h:0.6};
            for(let b of blocks) {
                if(checkRect(pRectX, {x:b.x-b.w/2, y:b.y-b.h/2, w:b.w, h:b.h})) {
                    if(player.vx > 0) player.x = b.x - b.w/2 - 0.3;
                    else player.x = b.x + b.w/2 + 0.3;
                    player.vx = 0;
                }
            }

            // Y Movement
            if(keys.u && player.grounded) { player.vy = JUMP; player.grounded=false; }
            player.vy -= GRAVITY * dt;
            player.y += player.vy * dt;

            // Y Collision
            player.grounded = false;
            const pRectY = {x:player.x-0.2, y:player.y-0.4, w:0.4, h:0.8};
            for(let b of blocks) {
                if(checkRect(pRectY, {x:b.x-b.w/2, y:b.y-b.h/2, w:b.w, h:b.h})) {
                    if(player.vy < 0) { // Landing
                        player.y = b.y + b.h/2 + 0.4;
                        player.vy = 0;
                        player.grounded = true;
                    } else { // Bonk head
                        player.y = b.y - b.h/2 - 0.4;
                        player.vy = 0;
                        // Block interaction
                        if(b.type === 'q' && b.active) {
                            b.active = false;
                            b.mesh.material = matHard; // Change to solid
                            score += 100;
                            coins++;
                            updateUI();
                        }
                        if(b.type === 'brick') {
                            // SML Bump
                            b.mesh.position.y += 0.2;
                            setTimeout(()=>b.mesh.position.y -= 0.2, 100);
                        }
                    }
                }
            }

            // Pit death
            if(player.y < -5) die();

            // --- GOOMBAS ---
            for(let i=goombas.length-1; i>=0; i--) {
                const g = goombas[i];
                if(g.dead) continue;

                // Move
                if(Math.abs(g.x - player.x) < 10) { // Active radius
                    g.x += g.vx * dt;
                    
                    // Simple wall turn
                    // (Omitted strict wall checks for performance, just patrol bounds logic usually)
                }

                g.mesh.position.x = g.x;

                // Player vs Goomba
                // Hitbox logic
                const gx = g.x, gy = g.y, gw = 0.6, gh = 0.6;
                const px = player.x, py = player.y;

                if(px+0.3 > gx-gw/2 && px-0.3 < gx+gw/2 && py+0.4 > gy-gh/2 && py-0.4 < gy+gh/2) {
                    // Collision
                    if(player.vy < 0 && player.y > g.y + 0.2) {
                        // Stomp
                        g.dead = true;
                        player.vy = 5; // Bounce
                        scene.remove(g.mesh); // In SML they just vanish or squish
                        g.mesh.scale.y = 0.1; 
                        score += 100;
                        updateUI();
                        setTimeout(()=>{gameLayer.remove(g.mesh)}, 200);
                    } else {
                        // Die
                        die();
                    }
                }
            }

            // Sync visual
            marioMesh.position.set(player.x, player.y, 0.3);
            marioMesh.scale.x = player.facingRight ? 1 : -1;

            // Camera/Scroll
            const camTgt = -player.x + 1;
            gameLayer.position.x += (camTgt - gameLayer.position.x) * 0.1;
            
            // Parallax
            bgGroup.position.x = gameLayer.position.x * 0.5; // Pyramids move slow
        }

        function die() {
            if(player.dead) return;
            player.dead = true;
            player.vy = 8; // Death hop
            // Disable collision in update
            setTimeout(() => {
                // Reset
                player.dead = false;
                player.x = 0; player.y = 0; player.vx = 0; player.vy = 0;
                gameLayer.position.x = 0;
                score = 0; coins = 0; updateUI();
            }, 2000);
        }

        // --- GAMEBOY BUTTONS MESHES ---
        const btnGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.4, 32); btnGeo.rotateX(Math.PI/2);
        const ba = new THREE.Mesh(btnGeo, matBtnA); ba.position.set(3, -2.5, 1.1); gbGroup.add(ba);
        const bb = new THREE.Mesh(btnGeo, matBtnA); bb.position.set(1.5, -3.5, 1.1); gbGroup.add(bb);
        const pill = new THREE.BoxGeometry(1.2, 0.4, 0.2); pill.rotateZ(-0.4);
        const bsel = new THREE.Mesh(pill, matBtnStart); bsel.position.set(-0.5, -6, 1.1); gbGroup.add(bsel);
        const bsta = new THREE.Mesh(pill, matBtnStart); bsta.position.set(1.5, -6, 1.1); gbGroup.add(bsta);
        const dpad = new THREE.Group(); dpad.position.set(-2.5, -3, 1.1); gbGroup.add(dpad);
        dpad.add(new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.8, 0.2), matDpad));
        dpad.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 0.2), matDpad));

        // Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            update(Math.min(clock.getDelta(), 0.1));
            controls.update();
            renderer.render(scene, camera);
        }
        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
        animate();

    </script>
</body>
