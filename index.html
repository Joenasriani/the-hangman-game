<!DOCTYPE html>
<html>
  <head>
    <title>The Enchanted Hangman</title>
    <meta name="description" content="The Enchanted Hangman - Immersive VR/AR Word Game">
    <!-- Import A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Import A-Frame Environment Component -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.4/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene 
      game-manager 
      vr-mode-ui="enabled: true" 
      background="color: #001122"
      fog="type: exponential; color: #001122; density: 0.0025"
    >
      
      <!-- ASSETS -->
      <a-assets>
        <!-- Placeholder audio sources (using data URLs to avoid loading issues) -->
        <audio id="ambient-forest" preload="auto" loop></audio>
        <audio id="key-click" preload="auto"></audio>
        <audio id="key-hover" preload="auto"></audio>
        <audio id="correct-guess" preload="auto"></audio>
        <audio id="wrong-guess" preload="auto"></audio>
        <audio id="victory" preload="auto"></audio>
        <audio id="defeat" preload="auto"></audio>
        <audio id="construction" preload="auto"></audio>
      </a-assets>

      <!-- LIGHTING SYSTEM -->
      <a-light type="ambient" color="#404080" intensity="0.4"></a-light>
      <a-light type="directional" color="#FFA500" position="5 10 5" intensity="0.6"></a-light>
      <a-light type="point" color="#FF6B35" position="0 4 -2" intensity="0.3" distance="15"></a-light>

      <!-- SIMPLE ENVIRONMENT -->
      
      <!-- Ground -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" 
        color="#1A2F1A" shadow="receive: true"
      ></a-plane>
      
      <!-- Simple Trees -->
      <a-entity position="-8 0 -12">
        <a-cone color="#0F4F0F" radius-bottom="0.8" radius-top="0" height="5" position="0 2.5 0"></a-cone>
        <a-cylinder color="#4A2C17" radius="0.2" height="2" position="0 1 0"></a-cylinder>
      </a-entity>
      
      <a-entity position="10 0 -15">
        <a-cone color="#1A5F1A" radius-bottom="1.0" radius-top="0" height="6" position="0 3 0"></a-cone>
        <a-cylinder color="#4A2C17" radius="0.25" height="2.5" position="0 1.25 0"></a-cylinder>
      </a-entity>
      
      <!-- Simple Rocks -->
      <a-box position="-4 0.3 -6" width="1.2" height="0.6" depth="0.8" color="#555577"></a-box>
      <a-box position="7 0.4 -9" width="1.6" height="0.8" depth="1.0" color="#666688"></a-box>

      <!-- PLAYER RIG -->
      <a-entity id="playerRig" position="0 0 3">
        <!-- Camera -->
        <a-camera position="0 1.6 0" wasd-controls look-controls>
          <!-- Simple Cursor -->
          <a-cursor 
            id="main-cursor"
            color="#00FFFF"
            raycaster="objects: .clickable; far: 20"
          ></a-cursor>
        </a-camera>
        
        <!-- VR Controllers (Simple) -->
        <a-entity 
          id="left-controller" 
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 10"
        ></a-entity>
        
        <a-entity 
          id="right-controller" 
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 10"
        ></a-entity>
      </a-entity>

      <!-- GAME UI -->
      
      <!-- Game Title -->
      <a-text
        id="game-title"
        value="THE ENCHANTED HANGMAN"
        align="center"
        width="8"
        position="0 4.2 -3"
        color="#FFD700"
      ></a-text>
      
      <!-- Word Display -->
      <a-entity 
        id="word-display" 
        position="0 2.8 -3"
        visible="false"
      ></a-entity>
      
      <!-- Status Message -->
      <a-text
        id="status-message"
        value="Welcome to The Enchanted Hangman!"
        align="center"
        width="6"
        position="0 3.4 -3"
        color="#FFFFFF"
      ></a-text>
      
      <!-- Start/Reset Button -->
      <a-entity 
        id="start-reset-button-container" 
        position="0 2.0 -2.8"
      >
        <!-- Large Clickable Button -->
        <a-box
          id="start-reset-button"
          class="clickable"
          width="3.0"
          height="0.8"
          depth="0.3"
          color="#FF6B35"
          animation__hoveron="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
          animation__hoveroff="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"
          animation__clickscale="property: scale; to: 1.2 1.2 1.2; startEvents: mousedown; dur: 100; dir: alternate; loop: 2"
        >
          <a-text
            id="start-reset-button-text"
            value="START THE ENCHANTMENT"
            align="center"
            width="4"
            position="0 0 0.16"
            color="#FFFFFF"
          ></a-text>
        </a-box>
      </a-entity>
      
      <!-- Keyboard Container -->
      <a-entity 
        id="keyboard" 
        position="0 1.2 -2.8"
        scale="1.5 1.5 1.5"
        visible="false"
      ></a-entity>
      
      <!-- HANGMAN STRUCTURE -->
      <a-entity id="hangman-structure" position="0 4.5 -4" scale="1.2 1.2 1.2">
        
        <!-- Base -->
        <a-box id="hm-base" 
          position="0 0.1 0" 
          width="3.0" 
          height="0.3" 
          depth="1.5" 
          color="#654321"
          visible="false"
        ></a-box>
        
        <!-- Post -->
        <a-cylinder id="hm-post" 
          position="1.2 1.5 0" 
          radius="0.15" 
          height="2.8" 
          color="#654321"
          visible="false"
        ></a-cylinder>
        
        <!-- Beam (Longer as requested) -->
        <a-box id="hm-beam" 
          position="-0.15 2.8 0" 
          width="2.7" 
          height="0.25" 
          depth="0.25" 
          color="#654321"
          visible="false"
        ></a-box>
        
        <!-- Rope (Black as requested) -->
        <a-cylinder id="hm-rope" 
          position="-1.2 2.4 0" 
          radius="0.05" 
          height="0.8" 
          color="#000000"
          visible="false"
        ></a-cylinder>
        
        <!-- Noose -->
        <a-torus id="hm-noose" 
          position="-1.2 1.9 0" 
          radius="0.15" 
          radius-tubular="0.03" 
          color="#000000"
          visible="false"
        ></a-torus>
        
        <!-- Head -->
        <a-sphere id="hm-head" 
          position="-1.2 1.6 0" 
          radius="0.18" 
          color="#FDBCB4"
          visible="false"
        ></a-sphere>
        
        <!-- Body -->
        <a-cylinder id="hm-body" 
          position="-1.2 1.15 0" 
          radius="0.12" 
          height="0.7" 
          color="#8B4513"
          visible="false"
        ></a-cylinder>
        
        <!-- Left Arm -->
        <a-cylinder id="hm-left-arm" 
          position="-1.35 1.25 0" 
          radius="0.05" 
          height="0.4" 
          rotation="0 0 -45"
          color="#FDBCB4"
          visible="false"
        ></a-cylinder>
        
        <!-- Right Arm -->
        <a-cylinder id="hm-right-arm" 
          position="-1.05 1.25 0" 
          radius="0.05" 
          height="0.4" 
          rotation="0 0 45"
          color="#FDBCB4"
          visible="false"
        ></a-cylinder>
        
        <!-- Left Leg -->
        <a-cylinder id="hm-left-leg" 
          position="-1.28 0.65 0" 
          radius="0.06" 
          height="0.5" 
          rotation="0 0 -20"
          color="#4169E1"
          visible="false"
        ></a-cylinder>
        
      </a-entity>

      <!-- Simple Audio Elements -->
      <a-sound id="key-click-sound" src="#key-click" position="0 1.2 -2.8" volume="0.6"></a-sound>
      <a-sound id="correct-guess-sound" src="#correct-guess" position="0 2.8 -3" volume="0.7"></a-sound>
      <a-sound id="wrong-guess-sound" src="#wrong-guess" position="0 4.5 -4" volume="0.8"></a-sound>
      <a-sound id="victory-sound" src="#victory" position="0 2.8 -3" volume="0.9"></a-sound>
      <a-sound id="defeat-sound" src="#defeat" position="0 4.5 -4" volume="0.9"></a-sound>

    </a-scene>

    <script>
    /*
     * Simple Game Manager - Focus on Functionality
     */
    AFRAME.registerComponent('game-manager', {
      schema: {},

      init: function () {
        console.log('Game Manager initializing...');
        
        // Word List
        this.wordList = [
          'WEBXR', 'AFRAME', 'VIRTUAL', 'REALITY', 'AUGMENTED', 'METAVERSE', 'QUEST', 'IMMERSIVE',
          'HEADSET', 'CONTROLLER', 'JAVASCRIPT', 'BROWSER', 'INTERNET', 'DEVELOPER', 'COMPONENT',
          'HANGMAN', 'PUZZLE', 'ADVENTURE', 'FANTASY', 'MAGIC', 'ENCHANTED', 'MYSTICAL', 'WIZARD'
        ];
        
        // Game State
        this.secretWord = '';
        this.guessedLetters = [];
        this.incorrectGuesses = 0;
        this.maxGuesses = 9; // 9 hangman parts
        this.gameActive = false;
        
        // Get UI Elements
        this.wordDisplayEl = document.getElementById('word-display');
        this.keyboardEl = document.getElementById('keyboard');
        this.statusMessageEl = document.getElementById('status-message');
        this.resetButtonContainerEl = document.getElementById('start-reset-button-container');
        this.resetButtonEl = document.getElementById('start-reset-button');
        this.resetButtonTextEl = document.getElementById('start-reset-button-text');
        
        // Get Hangman Parts (in order of construction)
        this.hangmanParts = [
          document.getElementById('hm-base'),      // 1
          document.getElementById('hm-post'),      // 2
          document.getElementById('hm-beam'),      // 3
          document.getElementById('hm-rope'),      // 4
          document.getElementById('hm-noose'),     // 5
          document.getElementById('hm-head'),      // 6
          document.getElementById('hm-body'),      // 7
          document.getElementById('hm-left-arm'),  // 8
          document.getElementById('hm-right-arm'), // 9
          document.getElementById('hm-left-leg')   // 10 (extra safety)
        ];
        
        // Initialize
        this.createKeyboard();
        this.hideAllHangmanParts();
        this.setupEventListeners();
        
        console.log('Game Manager initialized successfully');
      },
      
      setupEventListeners: function () {
        // Start/Reset Button
        this.resetButtonEl.addEventListener('click', () => {
          console.log('Start button clicked');
          this.startGame();
        });
        
        // Keyboard Events
        this.keyboardEl.addEventListener('click', (evt) => {
          this.handleKeyboardClick(evt);
        });
        
        console.log('Event listeners setup complete');
      },
      
      createKeyboard: function () {
        console.log('Creating keyboard...');
        
        const rows = [
          'QWERTYUIOP',
          'ASDFGHJKL', 
          'ZXCVBNM'
        ];
        
        let yPos = 0.6;
        
        rows.forEach((row, rowIndex) => {
          const rowLength = row.length;
          const keySpacing = 0.4;
          const keySize = 0.35;
          const xOffset = -(rowLength * keySpacing) / 2 + (keySpacing / 2);
          
          for (let i = 0; i < row.length; i++) {
            const letter = row[i];
            
            // Create Key
            const keyButton = document.createElement('a-box');
            keyButton.setAttribute('position', `${xOffset + i * keySpacing} ${yPos} 0`);
            keyButton.setAttribute('width', keySize);
            keyButton.setAttribute('height', keySize);
            keyButton.setAttribute('depth', '0.15');
            keyButton.setAttribute('color', '#2C3E50');
            keyButton.setAttribute('class', 'clickable keyboard-button');
            keyButton.setAttribute('data-letter', letter);
            
            // Hover animations
            keyButton.setAttribute('animation__hoveron', 'property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200');
            keyButton.setAttribute('animation__hoveroff', 'property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200');
            keyButton.setAttribute('animation__clickscale', 'property: scale; to: 0.9 0.9 0.9; startEvents: mousedown; dur: 100; dir: alternate; loop: 2');
            
            // Key Text
            const keyText = document.createElement('a-text');
            keyText.setAttribute('value', letter);
            keyText.setAttribute('align', 'center');
            keyText.setAttribute('width', '4');
            keyText.setAttribute('color', '#FFFFFF');
            keyText.setAttribute('position', '0 0 0.08');
            
            keyButton.appendChild(keyText);
            this.keyboardEl.appendChild(keyButton);
          }
          
          yPos -= keySpacing;
        });
        
        console.log('Keyboard created successfully');
      },
      
      handleKeyboardClick: function (evt) {
        if (!this.gameActive) return;
        
        const buttonEl = evt.target;
        if (!buttonEl.classList.contains('keyboard-button')) return;
        
        const letter = buttonEl.getAttribute('data-letter');
        if (this.guessedLetters.includes(letter)) return;
        
        console.log('Key pressed:', letter);
        
        this.guessedLetters.push(letter);
        
        // Disable key
        this.disableKey(buttonEl);
        
        // Process guess
        this.processGuess(letter);
      },
      
      disableKey: function (buttonEl) {
        buttonEl.setAttribute('color', '#444444');
        buttonEl.removeAttribute('animation__hoveron');
        buttonEl.removeAttribute('animation__hoveroff');
        buttonEl.removeAttribute('animation__clickscale');
        
        const textEl = buttonEl.querySelector('a-text');
        if (textEl) {
          textEl.setAttribute('color', '#888888');
        }
      },
      
      processGuess: function (letter) {
        let correctGuess = false;
        let wordComplete = true;
        
        // Check if letter is in the word
        const letterElements = this.wordDisplayEl.children;
        for (let i = 0; i < this.secretWord.length; i++) {
          if (this.secretWord[i] === letter) {
            const letterEl = letterElements[i].querySelector('a-text');
            letterEl.setAttribute('value', letter);
            letterEl.setAttribute('color', '#00FF88');
            correctGuess = true;
          }
          
          // Check if word is complete
          const currentLetterEl = letterElements[i].querySelector('a-text');
          if (currentLetterEl.getAttribute('value') === '_') {
            wordComplete = false;
          }
        }
        
        if (correctGuess) {
          this.statusMessageEl.setAttribute('value', 'Excellent magic! Keep casting!');
          
          if (wordComplete) {
            setTimeout(() => this.endGame(true), 500);
          }
        } else {
          this.incorrectGuesses++;
          const remaining = this.maxGuesses - this.incorrectGuesses;
          this.statusMessageEl.setAttribute('value', `The dark magic grows... ${remaining} chances remain!`);
          
          this.showHangmanPart();
          
          if (this.incorrectGuesses >= this.maxGuesses) {
            setTimeout(() => this.endGame(false), 1000);
          }
        }
      },
      
      showHangmanPart: function () {
        const partIndex = this.incorrectGuesses - 1;
        
        if (partIndex >= 0 && partIndex < this.hangmanParts.length) {
          const part = this.hangmanParts[partIndex];
          if (part) {
            part.setAttribute('visible', 'true');
            console.log('Showing hangman part:', partIndex + 1);
          }
        }
      },
      
      startGame: function () {
        console.log('Starting new game...');
        
        this.gameActive = true;
        this.guessedLetters = [];
        this.incorrectGuesses = 0;
        this.secretWord = this.wordList[Math.floor(Math.random() * this.wordList.length)];
        
        console.log('Secret word:', this.secretWord);
        
        // Update UI
        this.statusMessageEl.setAttribute('value', 'Cast your spell by guessing a letter!');
        this.resetButtonContainerEl.setAttribute('visible', 'false');
        this.keyboardEl.setAttribute('visible', 'true');
        this.wordDisplayEl.setAttribute('visible', 'true');
        
        // Reset game elements
        this.resetKeyboard();
        this.hideAllHangmanParts();
        this.createWordDisplay();
      },
      
      createWordDisplay: function () {
        // Clear existing display
        while (this.wordDisplayEl.firstChild) {
          this.wordDisplayEl.removeChild(this.wordDisplayEl.firstChild);
        }
        
        const wordLength = this.secretWord.length;
        const letterSpacing = 0.4;
        const totalWidth = wordLength * letterSpacing;
        const startX = -totalWidth / 2 + (letterSpacing / 2);
        
        for (let i = 0; i < wordLength; i++) {
          const letterContainer = document.createElement('a-entity');
          letterContainer.setAttribute('position', `${startX + i * letterSpacing} 0 0`);
          
          // Letter background
          const letterBg = document.createElement('a-plane');
          letterBg.setAttribute('width', '0.35');
          letterBg.setAttribute('height', '0.35');
          letterBg.setAttribute('color', '#1A1A1A');
          letterBg.setAttribute('position', '0 0 -0.01');
          
          // Letter text
          const letterEl = document.createElement('a-text');
          letterEl.setAttribute('value', '_');
          letterEl.setAttribute('align', 'center');
          letterEl.setAttribute('width', '6');
          letterEl.setAttribute('color', '#FFFFFF');
          letterEl.setAttribute('position', '0 0 0');
          
          letterContainer.appendChild(letterBg);
          letterContainer.appendChild(letterEl);
          this.wordDisplayEl.appendChild(letterContainer);
        }
      },
      
      resetKeyboard: function () {
        const buttons = this.keyboardEl.querySelectorAll('.keyboard-button');
        buttons.forEach(button => {
          button.setAttribute('color', '#2C3E50');
          button.setAttribute('animation__hoveron', 'property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200');
          button.setAttribute('animation__hoveroff', 'property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200');
          button.setAttribute('animation__clickscale', 'property: scale; to: 0.9 0.9 0.9; startEvents: mousedown; dur: 100; dir: alternate; loop: 2');
          
          const textEl = button.querySelector('a-text');
          if (textEl) {
            textEl.setAttribute('color', '#FFFFFF');
          }
        });
      },
      
      hideAllHangmanParts: function () {
        this.hangmanParts.forEach(part => {
          if (part) part.setAttribute('visible', 'false');
        });
      },
      
      endGame: function (didWin) {
        console.log('Game ended. Won:', didWin);
        
        this.gameActive = false;
        
        if (didWin) {
          this.statusMessageEl.setAttribute('value', 'ENCHANTMENT SUCCESSFUL! You saved the realm!');
        } else {
          this.statusMessageEl.setAttribute('value', `The spell failed... The word was: ${this.secretWord}`);
          this.revealCompleteWord();
        }
        
        // Show reset button
        setTimeout(() => {
          this.keyboardEl.setAttribute('visible', 'false');
          this.resetButtonContainerEl.setAttribute('visible', 'true');
          this.resetButtonTextEl.setAttribute('value', 'CAST ANOTHER SPELL?');
        }, 2000);
      },
      
      revealCompleteWord: function () {
        const letterElements = this.wordDisplayEl.children;
        for (let i = 0; i < this.secretWord.length; i++) {
          const letterEl = letterElements[i].querySelector('a-text');
          if (letterEl) {
            letterEl.setAttribute('value', this.secretWord[i]);
            letterEl.setAttribute('color', '#FF6B6B');
          }
        }
      }
    });
    </script>
  </body>
</html>
