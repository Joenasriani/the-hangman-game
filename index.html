<!DOCTYPE html>
<html>
  <head>
    <title>The Enchanted Hangman</title>
    <meta name="description" content="The Enchanted Hangman - Enhanced VR/Mobile Word Game">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Import A-Frame Environment Component -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.4/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene 
      game-manager 
      mobile-controls
      vr-mode-ui="enabled: true" 
      background="color: #001122"
      fog="type: exponential; color: #001122; density: 0.0025"
      embedded style="height: 100vh; width: 100vw;"
    >
      
      <!-- ASSETS -->
      <a-assets>
        <!-- Simple audio placeholders -->
        <audio id="key-click" preload="auto"></audio>
        <audio id="correct-guess" preload="auto"></audio>
        <audio id="wrong-guess" preload="auto"></audio>
        <audio id="victory" preload="auto"></audio>
        <audio id="defeat" preload="auto"></audio>
      </a-assets>

      <!-- ENHANCED LIGHTING SYSTEM -->
      <a-light type="ambient" color="#404080" intensity="0.4"></a-light>
      <a-light type="directional" color="#FFA500" position="5 10 5" intensity="0.8" 
        light="castShadow: true; shadowMapHeight: 2048; shadowMapWidth: 2048"></a-light>
      <a-light type="point" color="#FF6B35" position="0 4 -2" intensity="0.5" distance="15"></a-light>
      <a-light type="point" color="#00AAFF" position="-5 3 -8" intensity="0.3" distance="10"></a-light>

      <!-- ENHANCED SUBDIVIDED ENVIRONMENT -->
      
      <!-- High-Quality Ground with Subdivisions -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" 
        geometry="primitive: plane; segmentsWidth: 20; segmentsHeight: 20"
        material="color: #1A2F1A; roughness: 0.9; metalness: 0.1; 
                 normalTextureRepeat: 10 10; 
                 shader: standard"
        shadow="receive: true"
      ></a-plane>
      
      <!-- Enhanced Trees with Subdivisions and Textures -->
      <a-entity position="-8 0 -12">
        <a-cone color="#0F4F0F" radius-bottom="0.8" radius-top="0" height="5" position="0 2.5 0"
          geometry="primitive: cone; segmentsRadial: 16; segmentsHeight: 8"
          material="color: #0F4F0F; roughness: 0.8; metalness: 0.1; 
                   emissive: #002200; emissiveIntensity: 0.1"
          shadow="cast: true"
          animation="property: rotation; from: 0 0 -2; to: 0 0 2; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine"
        ></a-cone>
        <a-cylinder color="#4A2C17" radius="0.2" height="2" position="0 1 0"
          geometry="primitive: cylinder; segmentsRadial: 12; segmentsHeight: 4"
          material="color: #4A2C17; roughness: 0.95; metalness: 0.05"
          shadow="cast: true"
        ></a-cylinder>
        <!-- Mystical Glow -->
        <a-sphere position="0 4 0" radius="2" 
          geometry="primitive: sphere; segmentsWidth: 16; segmentsHeight: 12"
          material="color: #00FF88; transparent: true; opacity: 0.08; shader: standard"
          animation="property: scale; from: 0.8 0.8 0.8; to: 1.2 1.2 1.2; dur: 3000; dir: alternate; loop: true"
        ></a-sphere>
      </a-entity>
      
      <a-entity position="10 0 -15">
        <a-cone color="#1A5F1A" radius-bottom="1.0" radius-top="0" height="6" position="0 3 0"
          geometry="primitive: cone; segmentsRadial: 20; segmentsHeight: 10"
          material="color: #1A5F1A; roughness: 0.8; metalness: 0.1; 
                   emissive: #003300; emissiveIntensity: 0.1"
          shadow="cast: true"
          animation="property: rotation; from: 0 0 1.5; to: 0 0 -1.5; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine"
        ></a-cone>
        <a-cylinder color="#4A2C17" radius="0.25" height="2.5" position="0 1.25 0"
          geometry="primitive: cylinder; segmentsRadial: 16; segmentsHeight: 6"
          material="color: #4A2C17; roughness: 0.95; metalness: 0.05"
          shadow="cast: true"
        ></a-cylinder>
        <!-- Mystical Glow -->
        <a-sphere position="0 5 0" radius="2.5" 
          geometry="primitive: sphere; segmentsWidth: 20; segmentsHeight: 15"
          material="color: #0088FF; transparent: true; opacity: 0.08; shader: standard"
          animation="property: scale; from: 0.9 0.9 0.9; to: 1.1 1.1 1.1; dur: 4000; dir: alternate; loop: true"
        ></a-sphere>
      </a-entity>
      
      <!-- Floating Mystical Orbs with Enhanced Geometry -->
      <a-sphere position="5 3 -8" radius="0.12" 
        geometry="primitive: sphere; segmentsWidth: 16; segmentsHeight: 12"
        material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.8; 
                 transparent: true; opacity: 0.9; roughness: 0.3; metalness: 0.7"
        animation="property: position; from: 5 3 -8; to: 5 5 -8; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine"
      ></a-sphere>
      
      <a-sphere position="-6 2.5 -10" radius="0.1" 
        geometry="primitive: sphere; segmentsWidth: 14; segmentsHeight: 10"
        material="color: #FF69B4; emissive: #FF69B4; emissiveIntensity: 0.8; 
                 transparent: true; opacity: 0.9; roughness: 0.3; metalness: 0.7"
        animation="property: position; from: -6 2.5 -10; to: -6 4 -10; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine"
      ></a-sphere>

      <!-- Enhanced Rocks with Subdivisions and Textures -->
      <a-dodecahedron position="-4 0.3 -6" radius="0.6" 
        geometry="primitive: dodecahedron; detail: 2"
        material="color: #555577; roughness: 0.8; metalness: 0.3;

        shadow="cast: true; receive: true"
        animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 20000; loop: true"
      ></a-dodecahedron>
      
      <a-dodecahedron position="7 0.4 -9" radius="0.8" 
        geometry="primitive: dodecahedron; detail: 2"
        material="color: #666688; roughness: 0.8; metalness: 0.3; 
                 emissive: #222244; emissiveIntensity: 0.2"
        shadow="cast: true; receive: true"
        animation="property: rotation; from: 0 0 0; to: 0 -360 0; dur: 25000; loop: true"
      ></a-dodecahedron>

      <!-- PLAYER RIG WITH MOBILE SUPPORT -->
      <a-entity id="playerRig" position="0 0 3">
        <!-- Enhanced Camera -->
        <a-camera id="main-camera" position="0 1.6 0" 
          wasd-controls="acceleration: 20; fly: false" 
          look-controls="reverseMouseDrag: true; touchEnabled: true; magicWindowTrackingEnabled: true"
        >
          <!-- Enhanced Cursor with Better Mobile Support -->
          <a-cursor 
            id="main-cursor"
            color="#00FFFF"
            geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.016"
            material="color: #00FFFF; emissive: #00FFFF; emissiveIntensity: 0.8; 
                     transparent: true; opacity: 0.9; shader: standard"
            raycaster="objects: .clickable; far: 20; near: 0.1"
            animation__glow="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dur: 1000; dir: alternate; loop: true"
            animation__pulse="property: material.emissiveIntensity; from: 0.5; to: 1.0; dur: 800; dir: alternate; loop: true"
          ></a-cursor>
        </a-camera>
        
        <!-- VR Controllers -->
        <a-entity 
          id="left-controller" 
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 10"
        ></a-entity>
        
        <a-entity 
          id="right-controller" 
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 10"
        ></a-entity>
      </a-entity>

      <!-- MOBILE TOUCH CONTROLS (Visible on Mobile) -->

        <!-- Movement Joystick -->

          position="-3.5 -2.5 -5"
          geometry="primitive: circle; radius: 0.8" 
          material="color: #333333; transparent: true; opacity: 0.7; shader: flat"
        >

            position="0 0 0.02"
            geometry="primitive: circle; radius: 0.3" 
            material="color: #00AAFF; transparent: true; opacity: 0.9; shader: flat"
          ></a-entity>
          <a-text value="MOVE" position="0 -1.1 0" align="center" color="#FFF" width="4"></a-text>
        </a-entity>
        
        <!-- Look Control -->
        <a-entity id="look-pad" 
          position="3.5 -2.5 -5"
          geometry="primitive: circle; radius: 0.8" 
          material="color: #333333; transparent: true; opacity: 0.7; shader: flat"
        >
          <a-text value="LOOK" position="0 -1.1 0" align="center" color="#FFF" width="4"></a-text>
        </a-entity>
      </a-entity>

      <!-- ENHANCED GAME UI -->
      
      <!-- Game Title with Enhanced Materials -->
      <a-text
        id="game-title"
        value="THE ENCHANTED HANGMAN"
        align="center"
        width="8"
        position="0 4.2 -3"
        material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.4; shader: msdf"
        animation__glow="property: material.emissiveIntensity; from: 0.3; to: 0.7; dur: 2000; dir: alternate; loop: true"
      ></a-text>
      
      <!-- Word Display -->
      <a-entity 
        id="word-display" 
        position="0 2.8 -3"
        visible="false"
      ></a-entity>
      
      <!-- Status Message -->
      <a-text
        id="status-message"
        value="Welcome to The Enchanted Hangman!"
        align="center"
        width="6"
        position="0 3.4 -3"
        material="color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 0.2; shader: msdf"
      ></a-text>
      
      <!-- Enhanced Start/Reset Button -->
      <a-entity 
        id="start-reset-button-container" 
        position="0 2.0 -2.8"
      >
        <!-- Large Mobile-Friendly Button -->
        <a-box
          id="start-reset-button"
          class="clickable mobile-button"
          width="3.5"
          height="1.0"
          depth="0.3"
          geometry="primitive: box; segmentsWidth: 2; segmentsHeight: 2; segmentsDepth: 2"
          material="color: #FF6B35; roughness: 0.4; metalness: 0.7; 
                   emissive: #FF6B35; emissiveIntensity: 0.3; shader: standard"
          animation__hoveron="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
          animation__hoveroff="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"
          animation__clickscale="property: scale; to: 1.2 1.2 1.2; startEvents: mousedown; dur: 100; dir: alternate; loop: 2"
          shadow="cast: true"
        >
          <!-- Glowing Border -->
          <a-ring 
            position="0 0 0.16" 
            radius-inner="1.6" 
            radius-outer="1.8" 
            geometry="primitive: ring; segmentsTheta: 32"
            material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.6; 
                     transparent: true; opacity: 0.9; shader: standard"
            animation__glow="property: material.emissiveIntensity; from: 0.4; to: 0.9; dur: 1500; dir: alternate; loop: true"
          ></a-ring>
          
          <a-text
            id="start-reset-button-text"
            value="START THE ENCHANTMENT"
            align="center"
            width="4"
            position="0 0 0.16"
            material="color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 0.4; shader: msdf"
          ></a-text>
        </a-box>
      </a-entity>
      
      <!-- ENHANCED SUBDIVIDED MECHANICAL KEYBOARD -->
      <a-entity 
        id="keyboard" 
        position="0 1.0 -2.5"
        scale="2.0 2.0 2.0"
        visible="false"
      >
        <!-- Enhanced Keyboard Base Frame with Subdivisions -->
        <a-box 
          position="0 -0.15 0" 
          width="6.8" 
          height="0.2" 
          depth="3.2" 
          geometry="primitive: box; segmentsWidth: 8; segmentsHeight: 2; segmentsDepth: 4"
          material="color: #1A1A1A; roughness: 0.4; metalness: 0.9; 
                   emissive: #0A0A0A; emissiveIntensity: 0.2; shader: standard"
          shadow="cast: true; receive: true"
        ></a-box>
      </a-entity>
      
      <!-- ENHANCED ANIMATED HANGMAN STRUCTURE WITH SUBDIVISIONS -->
      <a-entity id="hangman-structure" position="0 4.5 -4" scale="1.3 1.3 1.3">
        
        <!-- Enhanced Base with Subdivisions and Wood Texture -->
        <a-box id="hm-base" 
          position="0 0.15 0" 
          width="3.2" 
          height="0.4" 
          depth="1.8" 
          geometry="primitive: box; segmentsWidth: 6; segmentsHeight: 2; segmentsDepth: 4"
          material="color: #654321; roughness: 0.9; metalness: 0.1; 
                   emissive: #2A1F0F; emissiveIntensity: 0.1; shader: standard"
          visible="false"
          shadow="cast: true; receive: true"
        ></a-box>
        
        <!-- Enhanced Post with Subdivisions -->
        <a-cylinder id="hm-post" 
          position="1.3 1.6 0" 
          radius="0.18" 
          height="3.0" 
          geometry="primitive: cylinder; segmentsRadial: 16; segmentsHeight: 8"
          material="color: #654321; roughness: 0.9; metalness: 0.1; 
                   emissive: #2A1F0F; emissiveIntensity: 0.1; shader: standard"
          visible="false"
          shadow="cast: true"
        ></a-cylinder>
        
        <!-- Enhanced Beam - Extra Long as Requested with Subdivisions -->
        <a-box id="hm-beam" 
          position="-0.1 3.0 0" 
          width="2.8" 
          height="0.3" 
          depth="0.3" 
          geometry="primitive: box; segmentsWidth: 8; segmentsHeight: 2; segmentsDepth: 2"
          material="color: #654321; roughness: 0.9; metalness: 0.1; 
                   emissive: #2A1F0F; emissiveIntensity: 0.1; shader: standard"
          visible="false"
          shadow="cast: true"
        ></a-box>
        
        <!-- Enhanced Black Rope with Subdivisions -->
        <a-cylinder id="hm-rope" 
          position="-1.3 2.5 0" 
          radius="0.06" 
          height="0.9" 
          geometry="primitive: cylinder; segmentsRadial: 12; segmentsHeight: 6"

          visible="false"

          animation__sway="property: rotation; from: 0 0 -3; to: 0 0 3; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine"
        ></a-cylinder>
        
        <!-- Enhanced Noose with Subdivisions -->
        <a-torus id="hm-noose" 
          position="-1.3 1.95 0"

        <!-- Enhanced Head with Subdivisions -->

        <!-- Enhanced Body with Subdivisions -->

        <!-- Enhanced Left Arm with Subdivisions -->
        <a-cylinder id="hm-left-arm" 
          position="-1.48 1.28 0"

        <!-- Enhanced Right Arm with Subdivisions -->
        <a-cylinder id="hm-right-arm" 
          position="-1.12 1.28 0" 
          radius="0.06"

          geometry="primitive: cylinder; segmentsRadial: 8; segmentsHeight: 4"

        <!-- Enhanced Left Leg with Subdivisions -->
        <a-cylinder id="hm-left-leg" 
          position="-1.38 0.65 0" 
          radius="0.07" 
          height="0.55" 
          rotation="0 0 -25"
          geometry="primitive: cylinder; segmentsRadial: 8; segmentsHeight: 4"
          material="color: #4169E1; roughness: 0.8; metalness: 0.0; shader: standard"

        ></a-cylinder>
        
        <!-- Enhanced Right Leg with Subdivisions -->
        <a-cylinder id="hm-right-leg"

          radius="0.07" 
          height="0.55"

    </a-scene>

    <script>
    /*
     * Mobile Controls Component
     */
    AFRAME.registerComponent('mobile-controls', {
      init: function () {
        this.playerRig = document.getElementById('playerRig');
        this.camera = document.getElementById('main-camera');
        this.mobileUI = document.getElementById('mobile-ui');
        this.joystick = document.getElementById('movement-joystick');
        this.joystickHandle = document.getElementById('joystick-handle');
        this.lookPad = document.getElementById('look-pad');
        
        // Detect mobile device
        this.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        this.isVR = false;
        
        // Movement state
        this.moveVector = new THREE.Vector3(0, 0, 0);
        this.isDragging = false;
        this.isLooking = false;
        this.startPos = {x: 0, y: 0};
        
        if (this.isMobile) {
          this.mobileUI.setAttribute('visible', 'true');
          this.setupMobileControls();
          console.log('Mobile controls enabled');
        }
        
        // VR mode detection
        this.el.addEventListener('enter-vr', () => {
          this.isVR = true;
          this.mobileUI.setAttribute('visible', 'false');
          console.log('Entered VR mode');
        });
        
        this.el.addEventListener('exit-vr', () => {
          this.isVR = false;
          if (this.isMobile) {
            this.mobileUI.setAttribute('visible', 'true');
          }
          console.log('Exited VR mode');
        });
      },
      
      setupMobileControls: function () {
        // Touch events for movement joystick
        this.joystick.addEventListener('touchstart', (evt) => {
          evt.preventDefault();
          this.isDragging = true;
          const touch = evt.touches[0];
          this.startPos = {x: touch.clientX, y: touch.clientY};
          console.log('Joystick touch start');
        });
        
        // Touch events for look pad
        this.lookPad.addEventListener('touchstart', (evt) => {
          evt.preventDefault();
          this.isLooking = true;
          const touch = evt.touches[0];
          this.startPos = {x: touch.clientX, y: touch.clientY};
          console.log('Look pad touch start');
        });
        
        // Global touch move
        document.addEventListener('touchmove', (evt) => {
          if (!this.isDragging && !this.isLooking) return;
          evt.preventDefault();
          
          const touch = evt.touches[0];
          const deltaX = touch.clientX - this.startPos.x;
          const deltaY = touch.clientY - this.startPos.y;
          
          if (this.isDragging) {
            // Update joystick handle
            const maxDistance = 50; // pixels
            const distance = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY), maxDistance);
            const angle = Math.atan2(deltaY, deltaX);
            
            const handleX = Math.cos(angle) * (distance / maxDistance) * 0.5;
            const handleZ = Math.sin(angle) * (distance / maxDistance) * 0.5;
            
            this.joystickHandle.setAttribute('position', `${handleX} 0 ${handleZ}`);
            
            // Update movement
            this.moveVector.set(
              Math.cos(angle) * (distance / maxDistance) * 0.05,
              0,
              Math.sin(angle) * (distance / maxDistance) * 0.05
            );
          }
          
          if (this.isLooking) {
            // Update camera rotation
            const sensitivity = 0.002;
            const currentRotation = this.camera.getAttribute('rotation');
            
            this.camera.setAttribute('rotation', {
              x: Math.max(-90, Math.min(90, currentRotation.x - deltaY * sensitivity * 57.3)),
              y: currentRotation.y - deltaX * sensitivity * 57.3,
              z: currentRotation.z
            });
          }
        });
        
        // Global touch end
        document.addEventListener('touchend', (evt) => {
          if (this.isDragging) {
            this.isDragging = false;
            this.joystickHandle.setAttribute('position', '0 0 0');
            this.moveVector.set(0, 0, 0);
            console.log('Joystick touch end');
          }
          
          if (this.isLooking) {
            this.isLooking = false;
            console.log('Look pad touch end');
          }
        });
      },
      
      tick: function () {
        if (this.isMobile && !this.isVR && this.moveVector.length() > 0) {
          const currentPos = this.playerRig.getAttribute('position');
          const cameraRotation = this.camera.getAttribute('rotation');
          const yaw = THREE.MathUtils.degToRad(cameraRotation.y);
          
          // Move relative to camera direction
          const forward = new THREE.Vector3(
            Math.sin(yaw) * this.moveVector.z,
            0,
            Math.cos(yaw) * this.moveVector.z
          );
          const right = new THREE.Vector3(
            Math.cos(yaw) * this.moveVector.x,
            0,
            -Math.sin(yaw) * this.moveVector.x
          );
          
          const newPos = {
            x: currentPos.x + forward.x + right.x,
            y: currentPos.y,
            z: currentPos.z + forward.z + right.z
          };
          
          this.playerRig.setAttribute('position', newPos);
        }
      }
    });

    /*
     * Enhanced Game Manager
     */
    AFRAME.registerComponent('game-manager', {
      schema: {},

      init: function () {
        console.log('Enhanced Game Manager initializing...');
        
        // Extended Word List

          'WEBXR', 'AFRAME', 'VIRTUAL', 'REALITY', 'AUGMENTED', 'METAVERSE', 'QUEST', 'IMMERSIVE',
          'HEADSET', 'CONTROLLER', 'HAPTIC', 'TRACKING', 'SPATIAL', 'HOLOGRAM', 'AVATAR',
          
          // Tech Terms
          'JAVASCRIPT', 'BROWSER', 'INTERNET', 'DEVELOPER', 'COMPONENT', 'ENTITY', 'SYSTEM',
          'GITHUB', 'CODING', 'PROGRAM', 'ALGORITHM', 'DATABASE', 'NETWORK', 'PROTOCOL',
          
          // Gaming Terms
          'HANGMAN', 'PUZZLE', 'ADVENTURE', 'FANTASY', 'MAGIC', 'ENCHANTED', 'MYSTICAL',
          'WIZARD', 'SPELL', 'POTION', 'CRYSTAL', 'DRAGON', 'KNIGHT', 'CASTLE',
          
          // Modern Tech
          'ARTIFICIAL', 'INTELLIGENCE', 'MACHINE', 'LEARNING', 'BLOCKCHAIN', 'QUANTUM',
          'CYBERPUNK', 'ROBOTICS', 'AUTOMATION', 'INNOVATION', 'DIGITAL', 'CLOUD'
        ];
        
        // Game State
        this.secretWord = '';
        this.guessedLetters = [];
        this.incorrectGuesses = 0;
        this.maxGuesses = 10; // Full hangman figure
        this.gameActive = false;
        
        // UI Elements
        this.wordDisplayEl = document.getElementById('word-display');
        this.keyboardEl = document.getElementById('keyboard');
        this.statusMessageEl = document.getElementById('status-message');
        this.resetButtonContainerEl = document.getElementById('start-reset-button-container');
        this.resetButtonEl = document.getElementById('start-reset-button');
        this.resetButtonTextEl = document.getElementById('start-reset-button-text');
        
        // Hangman Parts (in construction order)
        this.hangmanParts = [
          document.getElementById('hm-base'),      // 1
          document.getElementById('hm-post'),      // 2
          document.getElementById('hm-beam'),      // 3
          document.getElementById('hm-rope'),      // 4
          document.getElementById('hm-noose'),     // 5
          document.getElementById('hm-head'),      // 6
          document.getElementById('hm-body'),      // 7
          document.getElementById('hm-left-arm'),  // 8
          document.getElementById('hm-right-arm'), // 9
          document.getElementById('hm-left-leg'),  // 10
          document.getElementById('hm-right-leg')  // 11 (extra)
        ];
        
        // Initialize
        this.createEnhancedKeyboard();
        this.hideAllHangmanParts();
        this.setupEventListeners();
        
        console.log('Enhanced Game Manager initialized successfully');
      },
      
      setupEventListeners: function () {
        // Start/Reset Button
        this.resetButtonEl.addEventListener('click', () => {
          console.log('Start button clicked');
          this.startGame();
        });
        
        // Keyboard Events
        this.keyboardEl.addEventListener('click', (evt) => {
          this.handleKeyboardClick(evt);
        });
        
        console.log('Event listeners setup complete');
      },
      
      createEnhancedKeyboard: function () {
        console.log('Creating enhanced subdivided keyboard...');
        
        const rows = [
          'QWERTYUIOP',
          'ASDFGHJKL', 
          'ZXCVBNM'
        ];
        
        let yPos = 0.8;
        
        rows.forEach((row, rowIndex) => {
          const rowLength = row.length;
          const keySpacing = 0.38;
          const keySize = 0.32;
          const xOffset = -(rowLength * keySpacing) / 2 + (keySpacing / 2);
          
          for (let i = 0; i < row.length; i++) {
            const letter = row[i];
            
            // Create Enhanced Key Container
            const keyContainer = document.createElement('a-entity');
            keyContainer.setAttribute('position', `${xOffset + i * keySpacing} ${yPos} 0`);
            
            // Enhanced Key Body with Subdivisions
            const keyButton = document.createElement('a-box');
            keyButton.setAttribute('width', keySize);
            keyButton.setAttribute('height', keySize);
            keyButton.setAttribute('depth', '0.18');
            keyButton.setAttribute('geometry', 'primitive: box; segmentsWidth: 2; segmentsHeight: 2; segmentsDepth: 2');
            keyButton.setAttribute('material', `
              color: #2C3E50; 
              roughness: 0.3; 
              metalness: 0.8; 
              emissive: #1A1A1A; 
              emissiveIntensity: 0.1; 
              shader: standard
            `);
            keyButton.setAttribute('class', 'clickable keyboard-button mobile-button');
            keyButton.setAttribute('data-letter', letter);
            keyButton.setAttribute('shadow', 'cast: true');
            
            // Enhanced Animations
            keyButton.setAttribute('animation__hoveron', 'property: material.emissiveIntensity; to: 0.5; startEvents: mouseenter; dur: 200');
            keyButton.setAttribute('animation__hoveroff', 'property: material.emissiveIntensity; to: 0.1; startEvents: mouseleave; dur: 200');
            keyButton.setAttribute('animation__clickscale', 'property: scale; to: 0.85 0.85 0.85; startEvents: mousedown; dur: 100; dir: alternate; loop: 2');
            keyButton.setAttribute('animation__clickglow', 'property: material.emissiveIntensity; to: 0.8; startEvents: mousedown; dur: 100; dir: alternate; loop: 2');
            
            // Enhanced Key Letter Text
            const keyText = document.createElement('a-text');
            keyText.setAttribute('value', letter);
            keyText.setAttribute('align', 'center');
            keyText.setAttribute('width', '5');
            keyText.setAttribute('material', 'color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 0.3; shader: msdf');
            keyText.setAttribute('position', '0 0 0.1');
            
            // Enhanced Key Frame
            const keyFrame = document.createElement('a-ring');
            keyFrame.setAttribute('radius-inner', String(keySize * 0.65));
            keyFrame.setAttribute('radius-outer', String(keySize * 0.7));
            keyFrame.setAttribute('position', '0 0 0.092');
            keyFrame.setAttribute('geometry', 'primitive: ring; segmentsTheta: 16');
            keyFrame.setAttribute('material', `
              color: #FFD700; 
              emissive: #FFD700; 
              emissiveIntensity: 0.4; 
              transparent: true; 
              opacity: 0.9; 
              shader: standard
            `);
            
            // Assemble Enhanced Key
            keyButton.appendChild(keyText);
            keyButton.appendChild(keyFrame);
            keyContainer.appendChild(keyButton);
            
            this.keyboardEl.appendChild(keyContainer);
          }
          
          yPos -= keySpacing;
        });
        
        console.log('Enhanced subdivided keyboard created successfully');
      },
      
      handleKeyboardClick: function (evt) {
        if (!this.gameActive) return;
        
        let buttonEl = evt.target;
        
        // Find the keyboard button in case we clicked on child elements
        while (buttonEl && !buttonEl.classList.contains('keyboard-button')) {
          buttonEl = buttonEl.parentElement;
        }
        
        if (!buttonEl || !buttonEl.classList.contains('keyboard-button')) return;
        
        const letter = buttonEl.getAttribute('data-letter');
        if (!letter || this.guessedLetters.includes(letter)) return;
        
        console.log('Enhanced key pressed:', letter);
        
        this.guessedLetters.push(letter);
        
        // Disable key with enhanced effects
        this.disableEnhancedKey(buttonEl);
        
        // Process guess
        this.processGuess(letter);
      },
      
      disableEnhancedKey: function (buttonEl) {
        buttonEl.setAttribute('material', `
          color: #444444; 
          roughness: 0.9; 
          metalness: 0.2; 
          emissive: #222222; 
          emissiveIntensity: 0.05; 
          shader: standard
        `);
        
        // Remove animations
        buttonEl.removeAttribute('animation__hoveron');
        buttonEl.removeAttribute('animation__hoveroff');
        buttonEl.removeAttribute('animation__clickscale');
        buttonEl.removeAttribute('animation__clickglow');
        
        // Dim the text
        const textEl = buttonEl.querySelector('a-text');
        if (textEl) {
          textEl.setAttribute('material', 'color: #888888; emissive: #888888; emissiveIntensity: 0.1; shader: msdf');
        }
        
        // Dim the frame
        const frameEl = buttonEl.querySelector('a-ring');
        if (frameEl) {
          frameEl.setAttribute('material', `
            color: #444444; 
            emissive: #444444; 
            emissiveIntensity: 0.1; 
            transparent: true; 
            opacity: 0.3; 
            shader: standard
          `);
        }
      },
      
      processGuess: function (letter) {
        let correctGuess = false;
        let wordComplete = true;
        
        // Check if letter is in the word
        const letterElements = this.wordDisplayEl.children;
        for (let i = 0; i < this.secretWord.length; i++) {
          if (this.secretWord[i] === letter) {
            // Reveal letter with enhanced animation
            this.revealEnhancedLetter(letterElements[i], letter, i);
            correctGuess = true;
          }
          
          // Check if word is complete
          const letterEl = letterElements[i].querySelector('a-text');
          if (letterEl && letterEl.getAttribute('value') === '_') {
            wordComplete = false;
          }
        }
        
        if (correctGuess) {
          this.statusMessageEl.setAttribute('value', 'Excellent magic! Keep casting!');
          
          if (wordComplete) {
            setTimeout(() => this.endGame(true), 500);
          }
        } else {
          this.incorrectGuesses++;
          const remaining = this.maxGuesses - this.incorrectGuesses;
          this.statusMessageEl.setAttribute('value', `The dark magic grows... ${remaining} chances remain!`);
          
          this.animateEnhancedHangmanConstruction();
          
          if (this.incorrectGuesses >= this.maxGuesses) {
            setTimeout(() => this.endGame(false), 1000);
          }
        }
      },
      
      revealEnhancedLetter: function (letterContainer, letter, index) {
        const letterEl = letterContainer.querySelector('a-text');
        if (letterEl) {
          // Animate letter reveal with enhanced effects
          letterEl.setAttribute('value', letter);
          letterEl.setAttribute('animation__reveal', `
            property: scale; 
            from: 0.5 0.5 0.5; 
            to: 1.3 1.3 1.3; 
            dur: 400; 
            dir: alternate; 
            loop: 2; 
            easing: easeOutElastic
          `);
          letterEl.setAttribute('animation__glow', `
            property: material.emissiveIntensity; 
            from: 0.2; 
            to: 0.8; 
            dur: 400; 
            dir: alternate; 
            loop: 2
          `);
          
          // Staggered reveal effect with enhanced materials
          setTimeout(() => {
            letterEl.setAttribute('material', `
              color: #00FF88; 
              emissive: #00FF88; 
              emissiveIntensity: 0.3; 
              shader: msdf
            `);
          }, index * 100);
        }
      },
      
      animateEnhancedHangmanConstruction: function () {
        const partIndex = this.incorrectGuesses - 1;
        
        if (partIndex >= 0 && partIndex < this.hangmanParts.length) {
          const part = this.hangmanParts[partIndex];
          
          if (part) {
            // Show part with enhanced animation
            part.setAttribute('visible', 'true');
            
            // Enhanced construction animation
            part.setAttribute('animation__construct', `
              property: scale; 
              from: 0 0 0; 
              to: 1 1 1; 
              dur: 800; 
              easing: easeOutElastic
            `);
            
            // Enhanced glow effect
            part.setAttribute('animation__glow', `
              property: material.emissiveIntensity; 
              from: 0; 
              to: 0.3; 
              dur: 800; 
              easing: easeOutQuad
            `);
            
            console.log('Enhanced hangman part constructed:', partIndex + 1);
            
            // Enhanced screen shake effect
            this.createEnhancedScreenShake();
          }
        }
      },
      
      createEnhancedScreenShake: function () {
        const camera = document.getElementById('main-camera');
        const originalPos = camera.getAttribute('position');
        
        camera.setAttribute('animation__shake', `
          property: position; 
          from: ${originalPos.x} ${originalPos.y} ${originalPos.z}; 
          to: ${originalPos.x + 0.03} ${originalPos.y + 0.02} ${originalPos.z}; 
          dur: 80; 
          dir: alternate; 
          loop: 6; 
          easing: easeInOutQuad
        `);
      },
      
      startGame: function () {
        console.log('Starting enhanced game...');
        
        this.gameActive = true;
        this.guessedLetters = [];
        this.incorrectGuesses = 0;
        this.secretWord = this.wordList[Math.floor(Math.random() * this.wordList.length)];
        
        console.log('Secret word:', this.secretWord);
        
        // Update UI
        this.statusMessageEl.setAttribute('value', 'Cast your spell by guessing a letter!');
        this.resetButtonContainerEl.setAttribute('visible', 'false');
        this.keyboardEl.setAttribute('visible', 'true');
        this.wordDisplayEl.setAttribute('visible', 'true');
        
        // Reset game elements
        this.resetEnhancedKeyboard();
        this.hideAllHangmanParts();
        this.createEnhancedWordDisplay();
      },
      
      createEnhancedWordDisplay: function () {
        // Clear existing display
        while (this.wordDisplayEl.firstChild) {
          this.wordDisplayEl.removeChild(this.wordDisplayEl.firstChild);
        }
        
        const wordLength = this.secretWord.length;
        const letterSpacing = 0.45;
        const totalWidth = wordLength * letterSpacing;
        const startX = -totalWidth / 2 + (letterSpacing / 2);
        
        for (let i = 0; i < wordLength; i++) {
          const letterContainer = document.createElement('a-entity');
          letterContainer.setAttribute('position', `${startX + i * letterSpacing} 0 0`);
          
          // Enhanced letter background with subdivisions
          const letterBg = document.createElement('a-plane');
          letterBg.setAttribute('width', '0.4');
          letterBg.setAttribute('height', '0.4');
          letterBg.setAttribute('geometry', 'primitive: plane; segmentsWidth: 2; segmentsHeight: 2');
          letterBg.setAttribute('material', `
            color: #1A1A1A; 
            roughness: 0.7; 
            metalness: 0.3; 
            transparent: true; 
            opacity: 0.9; 
            shader: standard
          `);
          letterBg.setAttribute('position', '0 0 -0.01');
          
          // Enhanced letter text
          const letterEl = document.createElement('a-text');
          letterEl.setAttribute('value', '_');
          letterEl.setAttribute('align', 'center');
          letterEl.setAttribute('width', '6');
          letterEl.setAttribute('material', `
            color: #FFFFFF; 
            emissive: #FFFFFF; 
            emissiveIntensity: 0.2; 
            shader: msdf
          `);
          letterEl.setAttribute('position', '0 0 0');
          
          letterContainer.appendChild(letterBg);
          letterContainer.appendChild(letterEl);
          this.wordDisplayEl.appendChild(letterContainer);
        }
      },
      
      resetEnhancedKeyboard: function () {
        const buttons = this.keyboardEl.querySelectorAll('.keyboard-button');
        buttons.forEach(button => {
          // Reset enhanced visual state
          button.setAttribute('material', `
            color: #2C3E50; 
            roughness: 0.3; 
            metalness: 0.8; 
            emissive: #1A1A1A; 
            emissiveIntensity: 0.1; 
            shader: standard
          `);
          
          // Restore enhanced animations
          button.setAttribute('animation__hoveron', 'property: material.emissiveIntensity; to: 0.5; startEvents: mouseenter; dur: 200');
          button.setAttribute('animation__hoveroff', 'property: material.emissiveIntensity; to: 0.1; startEvents: mouseleave; dur: 200');
          button.setAttribute('animation__clickscale', 'property: scale; to: 0.85 0.85 0.85; startEvents: mousedown; dur: 100; dir: alternate; loop: 2');
          button.setAttribute('animation__clickglow', 'property: material.emissiveIntensity; to: 0.8; startEvents: mousedown; dur: 100; dir: alternate; loop: 2');
          
          // Reset enhanced text
          const textEl = button.querySelector('a-text');
          if (textEl) {
            textEl.setAttribute('material', 'color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 0.3; shader: msdf');
          }
          
          // Reset enhanced frame
          const frameEl = button.querySelector('a-ring');
          if (frameEl) {
            frameEl.setAttribute('material', `
              color: #FFD700; 
              emissive: #FFD700; 
              emissiveIntensity: 0.4; 
              transparent: true; 
              opacity: 0.9; 
              shader: standard
            `);
          }
        });
      },
      
      hideAllHangmanParts: function () {
        this.hangmanParts.forEach(part => {
          if (part) part.setAttribute('visible', 'false');
        });
      },
      
      endGame: function (didWin) {
        console.log('Enhanced game ended. Won:', didWin);
        
        this.gameActive = false;
        
        if (didWin) {
          this.statusMessageEl.setAttribute('value', 'ENCHANTMENT SUCCESSFUL! You saved the realm!');
          this.createEnhancedVictoryEffects();
        } else {
          this.statusMessageEl.setAttribute('value', `The spell failed... The word was: ${this.secretWord}`);
          this.revealEnhancedCompleteWord();
        }
        
        // Show reset button
        setTimeout(() => {
          this.keyboardEl.setAttribute('visible', 'false');
          this.resetButtonContainerEl.setAttribute('visible', 'true');
          this.resetButtonTextEl.setAttribute('value', 'CAST ANOTHER SPELL?');
        }, 2000);
      },
      
      revealEnhancedCompleteWord: function () {
        const letterElements = this.wordDisplayEl.children;
        for (let i = 0; i < this.secretWord.length; i++) {
          const letterEl = letterElements[i].querySelector('a-text');
          if (letterEl) {
            letterEl.setAttribute('value', this.secretWord[i]);
            letterEl.setAttribute('material', `
              color: #FF6B6B; 
              emissive: #FF6B6B; 
              emissiveIntensity: 0.4; 
              shader: msdf
            `);
          }
        }
      },
      
      createEnhancedVictoryEffects: function () {
        // Enhanced victory particles with subdivisions
        for (let i = 0; i < 30; i++) {
          setTimeout(() => {
            const particle = document.createElement('a-sphere');
            particle.setAttribute('radius', '0.08');
            particle.setAttribute('geometry', 'primitive: sphere; segmentsWidth: 8; segmentsHeight: 6');
            particle.setAttribute('material', `
              color: #FFD700; 
              emissive: #FFD700; 
              emissiveIntensity: 0.9; 
              shader: standard
            `);
            particle.setAttribute('position', `
              ${(Math.random() - 0.5) * 6} 
              ${2 + Math.random() * 3} 
              ${-3 + (Math.random() - 0.5) * 3}
            `);
            particle.setAttribute('animation__float', `
              property: position; 
              to: 0 8 -3; 
              dur: 4000; 
              easing: easeOutQuad
            `);
            particle.setAttribute('animation__fade', `
              property: material.opacity; 
              from: 1; 
              to: 0; 
              dur: 4000; 
              easing: easeOutQuad
            `);
            
            this.el.appendChild(particle);
            
            setTimeout(() => {
              if (particle.parentNode) {
                this.el.removeChild(particle);
              }
            }, 4500);
          }, i * 150);
        }
      }
    });
    </script>
  </body>
</html>
